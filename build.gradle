// build.gradle (FINAL CORRECTED VERSION)

plugins {
	id 'fabric-loom' version '1.13-SNAPSHOT'
	id 'maven-publish'
}

// --- CONFIGURATION CACHE-SAFE VARIABLES ---
// Read all values needed by tasks from the project object here.
// These final variables are safe to use in task actions below.
final String modVersionForExpansion = project.version
final String archivesBaseName = project.archives_base_name

version = project.mod_version
group = project.maven_group

base {
	// The value is set here using the safe variable.
	archivesName = archivesBaseName
}

loom {
	splitEnvironmentSourceSets()

	// Re-enable legacy Mixin annotation processor so the refmap is generated by the AP.
	// Recent Loom versions disable the mixin AP by default; enable the legacy AP explicitly.
	useLegacyMixinAp = true

	mods {
		"barium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
    maven {
        name = 'ClothConfig'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'ModMenu'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    //Fabric api
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    //Mod Menu
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    //Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	// Mixin Annotation Processor: necessário para gerar o refmap durante a compilação
	annotationProcessor "net.fabricmc:sponge-mixin:0.13.4+mixin.0.8.5"
	// Garantir que o sourceSet client também tenha o processor (nome criado pelo Loom)
	clientAnnotationProcessor "net.fabricmc:sponge-mixin:0.13.4+mixin.0.8.5"
}

processResources {
	filesMatching("fabric.mod.json") {
		expand("version": modVersionForExpansion)
	}

    filesMatching("*.mixins.json") {
        expand("version": modVersionForExpansion)
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// THIS 'jar' TASK IS NOW CORRECT AND SAFE
jar {
	from("LICENSE") {
		// Use the safe final variable for the rename operation.
		rename { "${it}_${archivesBaseName}" }
	}
}

// THIS 'publishing' BLOCK IS NOW CORRECT AND SAFE
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			// Use the safe final variable for the artifactId.
			artifactId = archivesBaseName
			from components.java
		}
	}

	repositories {
		// Repositórios para publicação viriam aqui
	}
}