// build.gradle (FINAL CORRECTED VERSION)

plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
	id 'maven-publish'
}

// --- CONFIGURATION CACHE-SAFE VARIABLES ---
// Read all values needed by tasks from the project object here.
// These final variables are safe to use in task actions below.
final String modVersionForExpansion = project.version
final String archivesBaseName = project.archives_base_name

version = project.mod_version
group = project.maven_group

base {
	// The value is set here using the safe variable.
	archivesName = archivesBaseName
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"barium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
    maven {
        name = 'ClothConfig'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'ModMenu'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    //Fabric api
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    //Mod Menu
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    //Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
	filesMatching("fabric.mod.json") {
		expand("version": modVersionForExpansion)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// THIS 'jar' TASK IS NOW CORRECT AND SAFE
jar {
	from("LICENSE") {
		// Use the safe final variable for the rename operation.
		rename { "${it}_${archivesBaseName}" }
	}
}

// THIS 'publishing' BLOCK IS NOW CORRECT AND SAFE
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			// Use the safe final variable for the artifactId.
			artifactId = archivesBaseName
			from components.java
		}
	}

	repositories {
		// Repositórios para publicação viriam aqui
	}
}
