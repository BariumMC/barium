plugins {
    id 'fabric-loom' version '1.13.3'
    id 'maven-publish'
}

// --- CONFIGURATION CACHE-SAFE VARIABLES ---
final String modVersionForExpansion = project.version
final String archivesBaseName = project.archives_base_name

version = project.mod_version
group = project.maven_group

base {
    archivesName = archivesBaseName
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "barium" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven {
        name = 'ClothConfig'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'ModMenu'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // --- Mixin Annotation Processor ---
    annotationProcessor "org.spongepowered:mixin:0.8.5"
}

processResources {
    filesMatching("fabric.mod.json") {
        expand("version": modVersionForExpansion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21

    // 🔹 Força o compilador a gerar o refmap manualmente
    options.compilerArgs += [
        "-processor", "org.spongepowered.tools.obfuscation.MixinObfuscationProcessor",
        "-AoutRefMap=client-barium-refmap.json",
        "-AdefaultObfuscationEnv=named:intermediary"
    ]
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${archivesBaseName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = archivesBaseName
            from components.java
        }
    }
    repositories {
        // Adicione repositórios de publicação aqui se quiser
    }
}
