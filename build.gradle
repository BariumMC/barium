// build.gradle (FINAL CORRECTED VERSION)

plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// --- CONFIGURATION CACHE-SAFE VARIABLE ---
// Read the version from the project object here, during the configuration phase.
// This final variable is safe to use in task actions below.
final String modVersionForExpansion = project.version

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"barium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
    maven {
        name = 'ClothConfig'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'ModMenu'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    //Fabric api
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    //Mod Menu
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    //Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

// THIS BLOCK IS NOW CORRECT AND SAFE FOR THE CONFIGURATION CACHE
processResources {
	filesMatching("fabric.mod.json") {
		// Use the safe final variable instead of "project.version"
		expand(
            "version": modVersionForExpansion
        )
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Repositórios para publicação viriam aqui
	}
}